<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 커밋 은하</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="한 해 동안 깃허브에 남긴 커밋이 별이 되어 하나의 나선 은하를 이루는 3D 시각화">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 머리말(소개 | 아이디 조회) → 3D 은하 무대(발표 모드는 전체 화면) → 날짜 띠 → 색·읽는 법 → 저장소 순위 | 커밋 시각 → 달별 카드 → 자료 설명.
   1일차 키노트 '넓어지는 비트의 세상'과 같은 색: 바탕 거의 검정, 비트=시안, 아톰(사람에게 닿은 흔적)=금색 */
:root {
  color-scheme: dark;
  --bg: #0A0A0B; --bg-2: #111116; --panel: rgba(17, 17, 22, .78); --panel-2: rgba(244, 244, 242, .035);
  --ink: #F4F4F2; --dim: #A6A6A2; --faint: #6A6A6E;
  --cyan: #5AD6E6; --amber: #F3B03A; --bad: #FF9A9A;
  --rule: rgba(244, 244, 242, .12); --rule-hi: rgba(244, 244, 242, .24); --chip: rgba(244, 244, 242, .06); --chip-h: rgba(244, 244, 242, .12);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.7 var(--f-body); -webkit-font-smoothing: antialiased; word-break: keep-all; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 14px; }
a { color: var(--cyan); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }

/* 머리말 */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 20px 36px; align-items: end; padding-block: 40px 6px; }
.intro { display: grid; gap: 10px; min-width: 0; }
.eyebrow { margin: 0; font: 600 12.5px/1.4 var(--f-mono); letter-spacing: .12em; color: var(--cyan); }
h1 { margin: 0; font: 700 clamp(34px, 5.4vw, 60px)/1.08 var(--f-body); letter-spacing: -.025em; text-wrap: balance; }
h1 .yr { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.4px var(--cyan); text-shadow: 0 0 26px rgba(90, 214, 230, .35); }
.who { margin: 0; font-size: 15px; color: var(--dim); }
.who b { color: var(--ink); font-weight: 600; }
.lead { margin: 0; max-width: 64ch; color: var(--dim); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.fact { display: grid; padding: 8px 14px 9px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel-2); min-width: 0; }
.fact b { font: 500 22px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.fact.gold b { color: var(--amber); }
.fact span { font-size: 12px; color: var(--dim); }
.fact small { font: 12px/1.3 var(--f-mono); color: var(--faint); }

.lookup { display: grid; gap: 8px; padding: 16px 16px 14px; border: 1px solid var(--rule-hi); border-radius: 16px; background: linear-gradient(180deg, rgba(90, 214, 230, .07), rgba(17, 17, 22, .6)); min-width: 0; }
.lookup label { font-weight: 600; font-size: 14px; }
.lookup .row { display: flex; gap: 8px; }
.lookup .field { flex: 1; min-width: 0; display: flex; align-items: center; border: 1px solid var(--rule-hi); border-radius: 10px; background: rgba(0, 0, 0, .45); }
.lookup .field span { padding-left: 11px; color: var(--faint); font-family: var(--f-mono); }
.lookup input { flex: 1; min-width: 0; height: 40px; padding: 0 10px 0 4px; border: 0; background: transparent; font-family: var(--f-mono); font-size: 15px; outline: none; }
.lookup .field:focus-within { border-color: var(--cyan); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 15px; border: 1px solid var(--rule-hi); border-radius: 999px; background: var(--chip); backdrop-filter: blur(8px); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .2s, border-color .2s; }
.btn:hover { background: var(--chip-h); }
.btn.primary { background: var(--cyan); color: #04181B; border-color: transparent; }
.btn.primary:hover { background: #8BE6F0; }
.btn.small { min-height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: default; }
.lookup .help { margin: 0; font-size: 12.5px; line-height: 1.65; color: var(--dim); }
.lookup .status { margin: 0; font-size: 13px; line-height: 1.55; min-height: 1.55em; }
.lookup .status.err { color: var(--bad); }
.lookup .status.wait { color: var(--amber); }
.lookup .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.meter { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width .4s; }

/* 무대 */
.stage { position: relative; height: min(78vh, 780px); min-height: 460px; border: 1px solid var(--rule); border-radius: 20px; overflow: hidden; background: #07070A; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage:fullscreen { height: 100vh; border: 0; border-radius: 0; }
.stage:-webkit-full-screen { height: 100vh; border: 0; border-radius: 0; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#sky.dragging { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transition: opacity .35s; }
.lb.month { font: 500 11.5px/1 var(--f-mono); color: var(--faint); }
.lb.month.on { color: var(--ink); }
.lb.today { font: 600 11.5px/1 var(--f-mono); color: var(--cyan); }
.lb.left { font: 500 11.5px/1 var(--f-body); color: var(--faint); }
.lb.arm { font: 600 13px/1.2 var(--f-body); color: var(--c); text-shadow: 0 0 14px rgba(0, 0, 0, .9); }
.lb.arm span { font: 500 11.5px var(--f-mono); color: var(--dim); margin-left: 6px; }
.lb.repo { font: 500 12px/1.2 var(--f-mono); color: var(--ink); padding: 3px 7px; border-radius: 6px; background: rgba(5, 5, 8, .62); border: 1px solid rgba(255, 255, 255, .1); }
.lb.repo i { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); vertical-align: 1px; }
.lb.repo.gold { border-color: rgba(243, 176, 58, .5); }
.lb.launch { font: 600 12.5px/1.2 var(--f-mono); color: #fff; padding: 3px 8px; border-radius: 6px; background: rgba(5, 5, 8, .78); border: 1px solid var(--c); box-shadow: 0 0 18px -4px var(--c); }
.readout { position: absolute; left: 18px; top: 14px; pointer-events: none; display: grid; gap: 3px; }
.readout .date { font: 500 30px/1.05 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; text-shadow: 0 0 24px rgba(90, 214, 230, .3); }
.readout .count { font: 12.5px/1.45 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.readout .mini { display: block; width: 200px; height: 2px; margin-top: 5px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.readout .mini i { display: block; height: 100%; width: 0; background: var(--cyan); }
.controls { position: absolute; right: 14px; top: 14px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - 250px); }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--rule-hi); border-radius: 999px; background: rgba(10, 10, 11, .6); backdrop-filter: blur(8px); }
.seg button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(90, 214, 230, .16); color: var(--ink); }
.feed { position: absolute; left: 18px; bottom: 14px; display: grid; gap: 5px; pointer-events: none; max-width: min(380px, 60%); }
.feed .h { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; color: var(--faint); }
.feed .it { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.35; animation: feedIn .5s ease-out both; overflow: hidden; }
.feed .it span { font-family: var(--f-mono); color: var(--dim); font-size: 11.5px; flex: none; }
.feed .it b { font: 500 12.5px var(--f-mono); color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes feedIn { from { opacity: 0; transform: translateY(6px); } }
.mag { position: absolute; left: 18px; bottom: 36px; display: flex; align-items: center; gap: 12px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 10px; background: rgba(7, 7, 10, .62); backdrop-filter: blur(6px); font: 500 11.5px/1 var(--f-mono); color: var(--dim); pointer-events: none; }
.mag .t { font-family: var(--f-body); color: var(--faint); }
.mag .lv { display: inline-flex; align-items: center; gap: 6px; }
.mag .lv i { position: relative; display: inline-block; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, rgba(170, 236, 245, .6) 55%, rgba(90, 214, 230, 0) 72%); }
.mag .lv.l4 i::before, .mag .lv.l4 i::after { content: ""; position: absolute; left: 50%; top: 50%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); transform: translate(-50%, -50%); }
.mag .lv.l4 i::before { width: 26px; height: 1px; } .mag .lv.l4 i::after { width: 1px; height: 26px; background: linear-gradient(0deg, transparent, rgba(255,255,255,.85), transparent); }
.stage.storymode .mag { bottom: 18px; }
.hint { position: absolute; left: 18px; bottom: 12px; font-size: 12px; color: var(--faint); pointer-events: none; max-width: 60%; }
.card { position: absolute; right: 14px; bottom: 14px; width: min(380px, calc(100% - 28px)); padding: 14px 16px; border: 1px solid var(--rule-hi); border-radius: 14px; background: var(--panel); backdrop-filter: blur(14px); display: grid; gap: 7px; }
.card .tag { display: inline-flex; align-items: center; gap: 7px; font: 600 12px/1.3 var(--f-body); color: var(--dim); }
.card .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.card h3 { margin: 0; font: 600 16px/1.35 var(--f-mono); overflow-wrap: anywhere; }
.card .msg { margin: 0; font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
.card .desc { margin: 0; font-size: 13.5px; color: var(--dim); line-height: 1.6; }
.card .meta { display: flex; flex-wrap: wrap; gap: 3px 12px; font: 12px/1.5 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.card .meta .g { color: var(--amber); }
.card .links { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; align-items: center; }
.card .links button { border: 0; background: none; padding: 0; color: var(--cyan); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.card ol.cl { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.card ol.cl li { display: flex; justify-content: space-between; gap: 10px; font: 12.5px/1.4 var(--f-mono); }
.card ol.cl button { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit; }
.card ol.cl button:hover { color: var(--cyan); }
.card ol.cl i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 1px; }
.card ol.cl b { font-weight: 400; color: var(--dim); }
.card .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--dim); font-size: 19px; cursor: pointer; padding: 2px 7px; line-height: 1; }

/* 발표 모드 */
.stage.storymode .readout, .stage.storymode .controls, .stage.storymode .hint, .stage.storymode .card, .stage.storymode .feed { display: none; }
.story { position: absolute; left: clamp(20px, 4vw, 56px); top: clamp(20px, 4.5vh, 52px); max-width: min(40rem, 62%); pointer-events: none; background: radial-gradient(120% 120% at 0% 0%, rgba(10, 10, 11, .78), rgba(10, 10, 11, 0) 72%); padding: 6px 30px 30px 0; }
.story.in > * { animation: rise .8s cubic-bezier(.22, .61, .36, 1) both; }
.story.in > *:nth-child(2) { animation-delay: .08s; } .story.in > *:nth-child(3) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.story .era { margin: 0 0 10px; font: 600 clamp(12px, 1.3vw, 15px)/1.3 var(--f-mono); letter-spacing: .14em; color: var(--cyan); }
.story .era.gold { color: var(--amber); }
.story h2 { margin: 0 0 12px; font: 700 clamp(28px, 4.2vw, 56px)/1.16 var(--f-body); letter-spacing: -.02em; text-wrap: balance; }
.story h2 .c { color: var(--cyan); } .story h2 .a { color: var(--amber); }
.story .cap { margin: 0; font-size: clamp(16px, 1.7vw, 22px); line-height: 1.7; color: var(--dim); max-width: 34rem; }
.bigdate { position: absolute; right: clamp(20px, 4vw, 56px); bottom: clamp(70px, 10vh, 110px); text-align: right; pointer-events: none; }
.bigdate .n { display: block; font: 500 clamp(44px, 8.5vw, 120px)/.9 var(--f-mono); letter-spacing: -.045em; color: transparent; -webkit-text-stroke: 1.2px var(--cyan); text-shadow: 0 0 28px rgba(90, 214, 230, .35); font-variant-numeric: tabular-nums; }
.bigdate .w { display: block; margin-top: 10px; font: 500 clamp(12px, 1.2vw, 15px)/1.3 var(--f-mono); letter-spacing: .08em; color: var(--dim); }
.bignums { position: absolute; left: 0; right: 0; bottom: clamp(90px, 14vh, 150px); display: flex; justify-content: center; gap: clamp(24px, 6vw, 96px); pointer-events: none; }
.bignums div { text-align: center; animation: rise 1s cubic-bezier(.22, .61, .36, 1) both; }
.bignums div:nth-child(2) { animation-delay: .25s; } .bignums div:nth-child(3) { animation-delay: .5s; } .bignums div:nth-child(4) { animation-delay: .75s; }
.bignums b { display: block; font: 500 clamp(34px, 6vw, 88px)/1 var(--f-mono); letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.2px var(--cyan); text-shadow: 0 0 26px rgba(90, 214, 230, .3); font-variant-numeric: tabular-nums; }
.bignums div.gold b { -webkit-text-stroke-color: var(--amber); text-shadow: 0 0 26px rgba(243, 176, 58, .3); }
.bignums span { display: block; margin-top: 8px; font: 500 clamp(12px, 1.25vw, 16px)/1.3 var(--f-body); color: var(--dim); }
.storynav { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.storynav ol { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.storynav li { width: 26px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.storynav li i { display: block; height: 100%; width: 0; background: var(--cyan); }
.storynav li.done i { width: 100%; }
.storynav .btn { min-height: 34px; background: rgba(10, 10, 11, .55); }

/* 날짜 띠 */
.strip-wrap { border: 1px solid var(--rule); border-radius: 18px; padding: 14px 18px 8px; background: var(--panel-2); display: grid; gap: 6px; }
.strip-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; align-items: baseline; }
.strip-head h2 { margin: 0; font: 700 17px/1.3 var(--f-body); }
.strip-head .r { font: 12.5px/1.4 var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.strip-head .r b { color: var(--ink); font-weight: 500; }
#strip { display: block; width: 100%; height: 132px; cursor: pointer; touch-action: none; }

/* 색·읽는 법 */
.mid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.box { border: 1px solid var(--rule); border-radius: 18px; padding: 16px 18px; background: var(--panel-2); display: grid; gap: 10px; align-content: start; min-width: 0; }
.box h2 { margin: 0; font: 700 17px/1.3 var(--f-body); }
.box .sub { margin: 0; font-size: 13px; color: var(--dim); }
.box p.body { margin: 0; font-size: 14px; line-height: 1.85; }
.legend-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 7px; }
.legend button { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; font-size: 13px; cursor: pointer; transition: opacity .2s, border-color .2s; }
.legend button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.legend button span { font: 12px var(--f-mono); color: var(--faint); }
.legend button[aria-pressed="false"] { opacity: .35; }
.legend button:hover { border-color: var(--rule-hi); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--dim); }
.toggles label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.toggles input { accent-color: var(--cyan); width: 15px; height: 15px; }
.toggles .gold { color: var(--amber); }
.legend-note { margin: 0; font-size: 12px; color: var(--faint); }

/* 저장소 순위 | 커밋 시각 */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.rank-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.rank-tools input { height: 34px; min-width: 0; flex: 1 1 160px; max-width: 260px; padding: 0 12px; border: 1px solid var(--rule-hi); border-radius: 999px; background: rgba(0, 0, 0, .35); font-size: 13px; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 470px; overflow: auto; overscroll-behavior: contain; }
.rank li button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(60px, 34%) 46px; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
.rank li button:hover, .rank li button[aria-current="true"] { background: rgba(90, 214, 230, .08); }
.rank .k { font: 12px var(--f-mono); color: var(--faint); text-align: right; }
.rank .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font: 500 13px/1.3 var(--f-mono); }
.rank .nm i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.rank .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .nm em { font-style: normal; font-family: var(--f-body); color: var(--amber); font-size: 12px; flex: none; }
.rank .bar { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--c); opacity: .85; }
.rank .v { font: 12.5px var(--f-mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.rhythm { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px; align-items: center; }
.rhythm svg { width: 100%; height: auto; max-width: 220px; display: block; }
.wd { display: grid; gap: 6px; }
.wd .r { display: grid; grid-template-columns: 22px minmax(0, 1fr) 52px; gap: 8px; align-items: center; font-size: 12.5px; }
.wd .r span:first-child { color: var(--dim); }
.wd .r .bar { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.wd .r .bar i { display: block; height: 100%; background: var(--cyan); opacity: .7; border-radius: 8px; }
.wd .r .bar i.we { background: #8E84FF; opacity: .8; }
.wd .r .v { font: 12px var(--f-mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
.ins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.ins div { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: rgba(0, 0, 0, .25); display: grid; gap: 2px; min-width: 0; }
.ins dt { font-size: 12px; color: var(--dim); }
.ins dd { margin: 0; font: 500 17px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ins dd small { display: block; font: 12px/1.45 var(--f-body); color: var(--faint); margin-top: 2px; }

// ── 시간 ──
const DAY = 86400, KST = 9 * 3600, TAU = Math.PI * 2
const Y0 = Date.parse('2026-01-01T00:00:00+09:00') / 1000
const Y1 = Date.parse('2027-01-01T00:00:00+09:00') / 1000
const NDAYS = Math.round((Y1 - Y0) / DAY)
const kd = (t) => new Date((t + KST) * 1000)
const pad = (n) => String(n).padStart(2, '0')
const dayOf = (t) => Math.floor((t - Y0) / DAY)
const uOf = (t) => (t - Y0) / (Y1 - Y0)
const monthStart = (m) => Date.parse(`2026-${pad(m + 1)}-01T00:00:00+09:00`) / 1000
const fmtMD = (t) => { const d = kd(t); return `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일` }
const fmtDot = (t) => { const d = kd(t); return `${d.getUTCFullYear()}.${pad(d.getUTCMonth() + 1)}.${pad(d.getUTCDate())}` }
const fmtShort = (t) => { const d = kd(t); return `${d.getUTCMonth() + 1}.${pad(d.getUTCDate())}` }
const fmtTime = (t) => { const d = kd(t); return `${fmtDot(t)} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` }
const dayStart = (di) => Y0 + di * DAY
const nf = (n) => Math.round(n).toLocaleString('ko-KR')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]))
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
function rng(key) { let h = 2166136261; for (const ch of String(key)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) } let s = h >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const gauss = (r) => { const u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v) }

// ── 색: 비트=시안 계열 성운, 금색은 사람에게 닿은 흔적(포크)에만 ──
const CATS = [
  { id: 'cw', label: '커리큘럼 위버', color: '#5AD6E6' },
  { id: 'tool', label: '수업 도구', color: '#A97BFF' },
  { id: 'material', label: '수업 자료', color: '#6F8DFF' },
  { id: 'assess', label: '평가 도구', color: '#FF6FC2' },
  { id: 'util', label: '유틸리티', color: '#4FE3B0' },
  { id: 'personal', label: '개인 프로젝트', color: '#FF8A7A' },
]
const PALETTE = ['#6F8DFF', '#A97BFF', '#5AD6E6', '#FF6FC2', '#4FE3B0', '#FF8A7A']
const OTHER = '#9AA3B8', GOLD = new THREE.Color('#F3B03A')
const MONTHS_KO = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
const WD_KO = ['월', '화', '수', '목', '금', '토', '일']

// ── 은하 모양 ──
const G = { R0: 22, R1: 560, WIND: 1.8, FLOOR: -150 }
const radiusOf = (u) => G.R0 + (G.R1 - G.R0) * Math.pow(Math.max(0, Math.min(1, u)), 0.72)

// ── 자료 묶음 ──
function fromSnapshot(s) {
  const repos = s.repos.map(([name, cat, lang, desc, priv, created, stars, forks], i) => ({ i, name, full: name ? `${s.login}/${name}` : null, cat, lang, desc, priv: !!priv, created, stars, forks }))
  const commits = s.commits.map(([ri, t, size, files, msg, sha]) => ({ ri, t, size, files, msg, sha }))
  return {
    login: s.login, name: s.name, mode: 'snapshot', end: Date.parse(s.collected + 'T23:59:59+09:00') / 1000,
    repos, commits, prs: s.prs, total: commits.length, complete: true, hasSize: true, hasCat: true,
    newRepos: repos.filter(r => r.created >= '2026').length, newReposNote: '',
  }
}
let colorBy = 'cat'
function finalize(D) {
  const { repos, commits } = D
  commits.sort((a, b) => a.t - b.t || a.ri - b.ri)
  for (const r of repos) { r.n = 0; r.first = Infinity; r.last = -Infinity; r.dayset = new Set() }
  for (const c of commits) { const r = repos[c.ri]; r.n++; if (c.t < r.first) r.first = c.t; if (c.t > r.last) r.last = c.t; r.dayset.add(dayOf(c.t)) }
  D.active = repos.filter(r => r.n).sort((a, b) => a.first - b.first)
  D.byCount = [...D.active].sort((a, b) => b.n - a.n || a.first - b.first)
  let pk = 0
  for (const r of D.active) if (r.priv) r.alias = `비공개 저장소 ${++pk}`
  for (const r of D.active) r.label = r.name || r.alias
  for (const c of commits) { const d = kd(c.t); c.di = dayOf(c.t); c.m = d.getUTCMonth(); c.wd = (d.getUTCDay() + 6) % 7; c.hour = d.getUTCHours() + d.getUTCMinutes() / 60; c.u = uOf(c.t) }
  D.endDay = Math.min(NDAYS - 1, dayOf(D.end)); D.uEnd = uOf(D.end)
  D.forked = D.active.filter(r => r.forks > 0)
  applyGroups(D)
  return D
}
// 팔 나누기(분야 또는 언어) → 별 위치·별자리·성운까지 다시 계산
function applyGroups(D) {
  const { repos, commits } = D
  const by = D.hasCat ? colorBy : 'lang'
  if (by === 'cat') {
    D.groups = CATS.filter(c => D.active.some(r => r.cat === c.id)).map(c => ({ ...c, n: 0 }))
    for (const r of D.active) r.g = D.groups.findIndex(g => g.id === r.cat)
  } else {
    const tally = {}
    for (const r of D.active) { const l = r.lang || ''; tally[l] = (tally[l] || 0) + r.n }
    const ranked = Object.entries(tally).filter(([l]) => l).sort((a, b) => b[1] - a[1]).slice(0, PALETTE.length - (D.active.some(r => !r.lang) ? 1 : 0)).map(([l]) => l)
    D.groups = ranked.map((l, i) => ({ id: l, label: l, color: PALETTE[i], n: 0 }))
    if (D.active.some(r => !ranked.includes(r.lang || ''))) D.groups.push({ id: '', label: '기타·언어 없음', color: OTHER, n: 0 })
    for (const r of D.active) { const k = ranked.indexOf(r.lang || ''); r.g = k >= 0 ? k : D.groups.length - 1 }
  }
  for (const g of D.groups) { g.rgb = new THREE.Color(g.color); g.n = 0 }
  for (const r of D.active) r.color = D.groups[r.g].color
  for (const c of commits) { c.g = repos[c.ri].g; D.groups[c.g].n++ }
  // 큰 팔 두 개를 마주 보게, 작은 팔은 그 사이에
  const n = D.groups.length, order = [...D.groups.keys()].sort((a, b) => D.groups[b].n - D.groups[a].n)
  const slots = []; for (let k = 0; k < n; k++) slots.push(k % 2 === 0 ? k / 2 : Math.floor(n / 2) + (k - 1) / 2)
  order.forEach((gi, k) => { D.groups[gi].base = slots[k] * TAU / n })
  // 팔 안에서 저장소마다 고정된 줄기(큰 저장소가 팔 한가운데)
  for (let gi = 0; gi < n; gi++) {
    const list = D.active.filter(r => r.g === gi).sort((a, b) => b.n - a.n)
    const half = Math.max(1, Math.ceil((list.length - 1) / 2))
    list.forEach((r, k) => { r.off = k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2) / half * 0.95 })
  }
  for (const c of commits) {
    const r = repos[c.ri], g = D.groups[c.g], h = rng(c.sha || `${c.t}:${c.ri}:${c.msg}`)
    const rad = Math.max(G.R0 * 0.6, radiusOf(c.u) + gauss(h) * (1.5 + 0.012 * radiusOf(c.u)))
    const w = 13 + 0.12 * rad
    const th = g.base + G.WIND * Math.log(rad / G.R0) + (r.off * 0.85 + gauss(h) * 0.2) * w / rad
    c.x = rad * Math.sin(th); c.z = -rad * Math.cos(th)
    c.y = gauss(h) * (2.2 + 24 * Math.exp(-rad / 70))
    c.sz = 1.7 + h() * 0.9; c.ph = h() * TAU
  }
  // 잔디 별: 날짜×팔마다 하나. 밝기는 깃허브 잔디처럼 커밋 수 사분위로 네 단계
  const cells = new Map()
  for (const c of commits) {
    const key = c.di * 32 + c.g
    let e = cells.get(key)
    if (!e) cells.set(key, e = { di: c.di, g: c.g, n: 0, t0: c.t, repos: new Map() })
    e.n++; if (c.t < e.t0) e.t0 = c.t; e.repos.set(c.ri, (e.repos.get(c.ri) || 0) + 1)
  }
  D.cells = [...cells.values()].sort((a, b) => a.t0 - b.t0)
  const counts = D.cells.map(e => e.n).sort((a, b) => a - b)
  const q = (p) => counts.length ? counts[Math.min(counts.length - 1, Math.floor(p * (counts.length - 1)))] : 1
  const t1 = q(0.25), t2 = Math.max(q(0.5), t1 + 1), t3 = Math.max(q(0.75), t2 + 1)
  D.levels = [t1, t2, t3]
  const lt3 = Math.log2(t3 + 1), lmax = Math.log2((counts.at(-1) || 1) + 1)
  for (const e of D.cells) {
    e.level = e.n <= t1 ? 1 : e.n <= t2 ? 2 : e.n <= t3 ? 3 : 4
    const rad = radiusOf(uOf(dayStart(e.di) + DAY / 2)), g = D.groups[e.g]
    const th = g.base + G.WIND * Math.log(rad / G.R0)
    e.x = rad * Math.sin(th); e.z = -rad * Math.cos(th); e.y = 0; e.u = uOf(e.t0)
    e.spike = e.level === 4 ? 0.2 + 0.8 * Math.max(0, (Math.log2(e.n + 1) - lt3) / Math.max(0.5, lmax - lt3)) : 0
    e.sz = [0, 4.6, 6.6, 8.8, 11.5][e.level]
  }
  // 별자리: 저장소마다 커밋한 날의 중심을 날짜 순서로 잇는다(14일 넘게 쉬면 끊는다)
  D.nodes = []
  for (const r of D.active) {
    const byDay = new Map()
    for (const c of commits) if (c.ri === r.i) { const k = c.di; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(c) }
    r.nodes = [...byDay.entries()].sort((a, b) => a[0] - b[0]).map(([di, cs]) => {
      const n = cs.length, x = cs.reduce((s, c) => s + c.x, 0) / n, y = cs.reduce((s, c) => s + c.y, 0) / n, z = cs.reduce((s, c) => s + c.z, 0) / n
      return { di, n, x, y, z, u: cs[0].u, ri: r.i }
    })
    r.peak = r.nodes.reduce((a, b) => (b.n > a.n ? b : a), r.nodes[0])
    const cx = r.nodes.reduce((s, p) => s + p.x * p.n, 0) / r.n, cz = r.nodes.reduce((s, p) => s + p.z * p.n, 0) / r.n, cy = r.nodes.reduce((s, p) => s + p.y * p.n, 0) / r.n
    r.cx = cx; r.cy = cy; r.cz = cz
  }
  // 성운: 저장소×주, 팔×열흘 단위로 커밋이 몰린 곳에 구름
  D.clouds = []
  const bin = (key, c, map) => { let b = map.get(key); if (!b) map.set(key, b = { n: 0, x: 0, y: 0, z: 0, us: [], g: c.g, ri: c.ri }); b.n++; b.x += c.x; b.y += c.y; b.z += c.z; b.us.push(c.u) }
  const small = new Map(), big = new Map()
  for (const c of commits) { bin(`${c.ri}:${Math.floor(c.di / 7)}`, c, small); bin(`${c.g}:${Math.floor(c.di / 10)}`, c, big) }
  for (const [k, b] of small) if (b.n >= 10) D.clouds.push({ x: b.x / b.n, y: b.y / b.n, z: b.z / b.n, size: 14 + 5 * Math.sqrt(b.n), a: Math.min(0.09, 0.03 + 0.01 * Math.log2(b.n)), g: b.g, ri: b.ri, u: b.us.sort()[b.us.length >> 1], k })
  for (const [k, b] of big) if (b.n >= 8) D.clouds.push({ x: b.x / b.n, y: b.y / b.n * 0.4, z: b.z / b.n, size: 60 + 8 * Math.sqrt(b.n), a: Math.min(0.07, 0.02 + 0.008 * Math.log2(b.n)), g: b.g, ri: -1, u: b.us.sort()[b.us.length >> 1], k })
  D.perDay = Array.from({ length: NDAYS }, () => new Array(D.groups.length).fill(0))
  D.dayTotal = new Array(NDAYS).fill(0)
  for (const c of commits) { if (c.di >= 0 && c.di < NDAYS) { D.perDay[c.di][c.g]++; D.dayTotal[c.di]++ } }
}

      fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
        float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        void main(){ vec4 c = texture2D(tDiffuse, vUv); float v = smoothstep(1.05, 0.28, length(vUv - 0.5) * 1.2);
          c.rgb *= mix(0.55, 1.0, v); c.rgb += (h(vUv * vec2(1733.0, 977.0) + fract(uTime)) - 0.5) * 0.025; gl_FragColor = vec4(c.rgb, 1.0); }`,
    })
    composer.addPass(grain)
  }
} catch { composer = null }

// 텍스처: 0/1 글리프, 성운 구름 네 가지, 금색 고리
function cloudTexture() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S
  const g = c.getContext('2d'), r = rng('nebula')
  for (let v = 0; v < 4; v++) {
    const ox = (v % 2) * 256, oy = Math.floor(v / 2) * 256
    g.save(); g.beginPath(); g.rect(ox, oy, 256, 256); g.clip()

const strip = document.getElementById('strip'), sctx = strip.getContext('2d'), stripInfo = document.getElementById('stripInfo')
let stripHover = -1
function drawStrip() {
  if (!D) return
  const r = strip.getBoundingClientRect(); if (!r.width) return
  const pr = Math.min(devicePixelRatio || 1, 2)
  strip.width = Math.round(r.width * pr); strip.height = Math.round(r.height * pr)
  const w = r.width, h = r.height, top = 12, base = h - 22
  sctx.setTransform(pr, 0, 0, pr, 0, 0); sctx.clearRect(0, 0, w, h)
  const xOf = (d) => d / NDAYS * w, bw = Math.max(1, w / NDAYS - 0.6)
  const max = Math.max(1, ...D.dayTotal), nowDay = dayOf(st.clock)
  sctx.fillStyle = 'rgba(255,255,255,.025)'; sctx.fillRect(xOf(D.endDay + 1), top, w - xOf(D.endDay + 1), base - top)
  sctx.font = '500 11px "IBM Plex Mono", monospace'
  for (let m = 0; m < 12; m++) {
    const d0 = dayOf(monthStart(m)), x = xOf(d0), on = st.focusMonth === m
    if (on) { const d1 = m === 11 ? NDAYS : dayOf(monthStart(m + 1)); sctx.fillStyle = 'rgba(90,214,230,.1)'; sctx.fillRect(x, 0, xOf(d1) - x, base) }
    sctx.fillStyle = 'rgba(255,255,255,.12)'; sctx.fillRect(x, top - 4, 1, base - top + 4)
    sctx.fillStyle = on ? '#F4F4F2' : m <= kd(D.end).getUTCMonth() ? '#8A8A88' : '#4A4A4C'
    sctx.fillText(`${m + 1}월`, x + 4, h - 6)
  }
  for (let d = 0; d <= D.endDay; d++) {
    let y = base
    const row = D.perDay[d]
    for (let gi = 0; gi < row.length; gi++) {
      const n = row[gi]; if (!n || st.off.has(gi)) continue
      const bh = Math.max(1.5, Math.sqrt(n / max) * (base - top))
      sctx.globalAlpha = d <= nowDay ? 0.95 : 0.15
      if (st.focusMonth !== null && kd(dayStart(d)).getUTCMonth() !== st.focusMonth) sctx.globalAlpha *= 0.35
      sctx.fillStyle = D.groups[gi].color; sctx.fillRect(xOf(d), y - bh, bw, bh); y -= bh
    }
  }
  sctx.globalAlpha = 1
  sctx.fillStyle = 'rgba(255,255,255,.12)'; sctx.fillRect(0, base, w, 1.5)
  const px = xOf(Math.min(D.endDay + 1, (Math.max(Y0, st.clock) - Y0) / DAY))
  sctx.fillStyle = '#5AD6E6'; sctx.fillRect(0, base, px, 1.5)
  if (!atEnd()) { sctx.fillRect(px - 0.75, top - 6, 1.5, base - top + 6); sctx.beginPath(); sctx.arc(px, base + 1, 3.5, 0, TAU); sctx.fill() }
  if (stripHover >= 0) { sctx.fillStyle = 'rgba(255,255,255,.5)'; sctx.fillRect(xOf(stripHover) + bw / 2 - 0.5, top, 1, base - top) }
}
function stripDay(e) { const r = strip.getBoundingClientRect(); return Math.max(0, Math.min(NDAYS - 1, Math.floor((e.clientX - r.left) / r.width * NDAYS))) }
function setStripInfo(d) {
  if (d == null || d < 0) { const max = Math.max(0, ...D.dayTotal), md = D.dayTotal.indexOf(max); stripInfo.innerHTML = max ? `가장 많은 날 <b>${fmtMD(dayStart(md))}</b> 커밋 <b>${nf(max)}</b>개 · 막대 높이는 제곱근 눈금` : ''; return }
  const n = d <= D.endDay ? D.dayTotal[d] : null
  stripInfo.innerHTML = n == null ? `<b>${fmtMD(dayStart(d))}</b> 아직 오지 않은 날` : `<b>${fmtMD(dayStart(d))}</b> (${WD_KO[(kd(dayStart(d)).getUTCDay() + 6) % 7]}) 커밋 <b>${nf(n)}</b>개`
}
let scrubbing = false
function scrubTo(e) {
  if (st.story !== null) return
  const d = Math.min(D.endDay, stripDay(e))
  st.playing = false; st.focusRepo = null; st.focusMonth = null; st.focusDirty = true; card.hidden = true
  setClock(d >= D.endDay ? D.end : dayStart(d + 1) - 1)

}
strip.addEventListener('pointerdown', (e) => { scrubbing = true; try { strip.setPointerCapture(e.pointerId) } catch {} scrubTo(e) })

function renderRhythm() {
  const hours = new Array(24).fill(0), wd = new Array(7).fill(0)
  for (const c of D.commits) { hours[Math.floor(c.hour) % 24]++; wd[c.wd]++ }
  const N = D.commits.length || 1, hmax = Math.max(1, ...hours), peak = hours.indexOf(hmax)
  const cx = 110, cy = 110, r0 = 44, r1 = 98
  let svg = `<circle cx="${cx}" cy="${cy}" r="${r0 - 4}" fill="none" stroke="rgba(255,255,255,.08)"/>`
  for (let h = 0; h < 24; h++) {
    const a0 = (h / 24) * TAU - Math.PI / 2 + 0.02, a1 = ((h + 1) / 24) * TAU - Math.PI / 2 - 0.02
    const rr = r0 + (r1 - r0) * Math.sqrt(hours[h] / hmax)
    const p = (a, rad) => `${(cx + Math.cos(a) * rad).toFixed(2)} ${(cy + Math.sin(a) * rad).toFixed(2)}`
    const fill = h === peak ? '#5AD6E6' : h < 6 ? 'rgba(142,132,255,.6)' : 'rgba(90,214,230,.4)'
    if (hours[h]) svg += `<path d="M${p(a0, r0)} L${p(a0, rr)} A${rr} ${rr} 0 0 1 ${p(a1, rr)} L${p(a1, r0)} A${r0} ${r0} 0 0 0 ${p(a0, r0)} Z" fill="${fill}"><title>${h}시대 커밋 ${nf(hours[h])}개</title></path>`
  }
  for (const h of [0, 6, 12, 18]) { const a = (h / 24) * TAU - Math.PI / 2; svg += `<text x="${(cx + Math.cos(a) * (r1 + 10)).toFixed(1)}" y="${(cy + Math.sin(a) * (r1 + 10) + 4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#8A8A88">${h}</text>` }
  svg += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="22" font-family="IBM Plex Mono, monospace" fill="#F4F4F2">${peak}시</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Sans KR, sans-serif" fill="#A6A6A2">가장 많은 시각</text>`
  document.getElementById('clock').innerHTML = svg
  const wmax = Math.max(1, ...wd)
  document.getElementById('wd').innerHTML = `<div style="font-size:12px;color:var(--dim)">요일별 커밋 · 보라 막대는 주말</div>` + wd.map((n, k) => `<div class="r"><span>${WD_KO[k]}</span><span class="bar"><i class="${k >= 5 ? 'we' : ''}" style="width:${(n / wmax * 100).toFixed(1)}%"></i></span><span class="v">${nf(n)}</span></div>`).join('')
  const max = Math.max(0, ...D.dayTotal), md = D.dayTotal.indexOf(max)
  const mdRepos = new Set(D.commits.filter(c => c.di === md).map(c => c.ri)).size
  let best = 0, bs = 0, cur = 0, cs = 0
  for (let d = 0; d <= D.endDay; d++) { if (D.dayTotal[d]) { if (!cur) cs = d; cur++; if (cur > best) { best = cur; bs = cs } } else cur = 0 }
  const night = D.commits.filter(c => c.hour < 6).length, weekend = wd[5] + wd[6]
  const longest = [...D.active].sort((a, b) => (b.last - b.first) - (a.last - a.first))[0]
  const sample = D.complete ? '' : '<span class="sample">받은 커밋 기준</span>'
  const items = [
    ['가장 바빴던 날', D.commits.length ? fmtMD(dayStart(md)) : '–', D.commits.length ? `커밋 ${nf(max)}개 · 저장소 ${nf(mdRepos)}곳` : ''],
    ['가장 길게 이어진 커밋', best ? `${nf(best)}일 연속` : '–', best ? `${fmtMD(dayStart(bs))} ~ ${fmtMD(dayStart(bs + best - 1))}` : ''],
    ['0~6시 커밋', `${(night / N * 100).toFixed(1)}%`, `${nf(night)}개`],
    ['주말 커밋', `${(weekend / N * 100).toFixed(1)}%`, `${nf(weekend)}개`],
    ['가장 오래 이어진 저장소', longest ? esc(longest.label) : '–', longest ? `${fmtShort(longest.first)} – ${fmtShort(longest.last)} · ${nf(Math.round((longest.last - longest.first) / DAY) + 1)}일` : ''],
    ['다른 사람이 포크한 저장소', `${nf(D.forked.length)}곳`, D.forked.length ? `포크 ${nf(D.forked.reduce((s, r) => s + r.forks, 0))}번` : ''],
  ]
  document.getElementById('ins').innerHTML = items.map(([k, v, s], i) => `<div><dt>${k}${i < 4 ? sample : ''}</dt><dd>${v}${s ? `<small>${s}</small>` : ''}</dd></div>`).join('')
}

  renderMag(); renderHeader(); renderLegend(); renderRank(); renderRhythm(); renderMonths(); setStripInfo(null); updateReadout(); setPlayLabel()
  if (st.focusRepo !== null && D.repos[st.focusRepo]?.n) showRepoCard(D.repos[st.focusRepo]); else if (st.pick < 0) card.hidden = true
}
function loadDataset(next) {
  D = finalize(next)
  st.off.clear(); st.focusRepo = null; st.focusMonth = null; st.pick = -1; st.hover = -1; st.playing = false
  setClock(D.end); st.autoR = null
  refreshAll()
}

// ── 다른 아이디 조회(GitHub API, 로그인 없이) ──
const form = document.getElementById('lookup'), uid = document.getElementById('uid'), statusEl = document.getElementById('status'), helpEl = document.getElementById('help')
const stopBtn = document.getElementById('stop'), backBtn = document.getElementById('back'), goBtn = document.getElementById('go'), meter = document.getElementById('meter'), meterBar = document.getElementById('meterBar')
const API = 'https://api.github.com'
let job = null, canFetch = null
function setStatus(text, kind = '') { statusEl.textContent = text; statusEl.className = 'status' + (kind ? ' ' + kind : '') }
async function probe() { try { const r = await fetch(API + '/rate_limit', { cache: 'no-store' }); if (!r.ok) throw 0; await r.json(); canFetch = true } catch { canFetch = false } }
async function gh(path, my) {
  const res = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } })
  if (my?.cancelled) throw Object.assign(new Error('cancel'), { cancel: true })
  const rem = res.headers.get('x-ratelimit-remaining'), reset = +res.headers.get('x-ratelimit-reset') || 0, retry = +res.headers.get('retry-after') || 0
  if (res.status === 403 || res.status === 429) {
    if (rem === '0' || retry || res.status === 429) throw Object.assign(new Error('rate'), { rate: true, wait: Math.max(5, retry || (reset - Date.now() / 1000) + 2) })
    throw Object.assign(new Error('forbidden'), { status: 403 })
  }
  if (res.status === 404 || res.status === 422) throw Object.assign(new Error('notfound'), { notFound: true })
  if (!res.ok) throw Object.assign(new Error('http'), { status: res.status })
  return res.json()
}
const cacheKey = (login) => `commit-galaxy:v2:${login.toLowerCase()}`
function readCache(login) { try { const v = JSON.parse(localStorage.getItem(cacheKey(login)) || 'null'); if (v && Date.now() - v.savedAt < 6 * 3600e3) return v } catch {} return null }
function writeCache(login, v) { try { localStorage.setItem(cacheKey(login), JSON.stringify({ ...v, savedAt: Date.now() })) } catch {} }
function sleepCount(sec, my, label) {
  return new Promise((resolve, reject) => {
    const until = Date.now() + sec * 1000
    const tick = () => {
      if (my.cancelled) return reject(Object.assign(new Error('cancel'), { cancel: true }))
      const left = Math.ceil((until - Date.now()) / 1000)
      if (left <= 0) return resolve()
      setStatus(`${label} GitHub 검색 한도(1분에 10번)에 걸려 ${left}초 뒤 이어서 받습니다.`, 'wait')
      setTimeout(tick, 500)
    }
    tick()
  })
}
function liveDataset(state) {
  const repoIdx = new Map(), repos = [], commits = []
  for (const it of state.items) {
    const full = it.full
    if (!repoIdx.has(full)) {
      const meta = state.own[full.toLowerCase()]
      repoIdx.set(full, repos.length)
      const own = full.split('/')[0].toLowerCase() === state.login.toLowerCase()
      repos.push({ i: repos.length, name: own ? full.split('/')[1] : full, full, cat: '', lang: meta?.lang || '', desc: it.desc || '', priv: false, created: meta?.created || '', stars: meta?.stars || 0, forks: meta?.forks || 0 })
    }
    commits.push({ ri: repoIdx.get(full), t: it.t, size: 0, files: 0, msg: it.msg, sha: it.sha })
  }
  const total = state.units.every(u => u.total != null) ? state.units.reduce((s, u) => s + u.total, 0) : Math.max(commits.length, state.units.reduce((s, u) => s + (u.total || 0), 0))
  const owned = Object.values(state.own)
  return {
    login: state.login, name: state.name, mode: 'live', end: state.end, repos, commits, prs: state.prs, total,
    complete: state.done && commits.length >= total, hasSize: false, hasCat: false,
    newRepos: owned.length ? owned.filter(r => r.created >= '2026').length : null, newReposNote: owned.length ? `최근에 푸시한 저장소 ${nf(owned.length)}곳 기준` : '',
  }
}
async function lookup(login) {
  login = login.trim().replace(/^@/, '').replace(/^https?:\/\/github\.com\//, '').split(/[/?#\s]/)[0]
  if (!/^[a-z\d](?:[a-z\d-]{0,38})$/i.test(login)) { setStatus('깃허브 아이디는 영문·숫자·하이픈(-)으로만 이루어집니다.', 'err'); return }
  if (login.toLowerCase() === 'greatsong' && SNAP) { showSnapshot(); setHash(''); return }
  job?.cancel?.()
  const my = job = { cancelled: false, cancel() { this.cancelled = true } }
  if (canFetch === null) await probe()
  if (!canFetch) { setStatus(TXT.blocked, 'err'); return }
  if (st.story !== null) storyEnd()
  const cached = readCache(login)
  if (cached?.done) { loadDataset(liveDataset(cached)); setStatus(`@${login} 자료를 이 브라우저에 저장해 둔 것으로 표시했습니다.`); setHash(login); backBtn.hidden = !SNAP; return }
  goBtn.disabled = true; stopBtn.hidden = false; backBtn.hidden = !SNAP; meter.hidden = false; meterBar.style.width = '0%'
  setStatus(`@${login} 확인 중…`)
  const nowT = Math.min(Date.now() / 1000, Y1 - 1)
  const state = { login, name: login, own: {}, items: [], seen: new Set(), units: [], prs: null, end: nowT, done: false }
  try {
    try { const u = await gh(`/users/${encodeURIComponent(login)}`, my); state.login = u.login; state.name = u.name || u.login }
    catch (e) { if (e.notFound) { setStatus(`깃허브에 @${login} 아이디가 없습니다. 철자를 확인하세요.`, 'err'); return } if (e.cancel) throw e }
    try {
      const rs = await gh(`/users/${encodeURIComponent(state.login)}/repos?per_page=100&sort=pushed&type=owner`, my)
      for (const r of rs) state.own[r.full_name.toLowerCase()] = { lang: r.language || '', created: (r.created_at || '').slice(0, 10), stars: r.stargazers_count || 0, forks: r.forks_count || 0 }
    } catch (e) { if (e.cancel) throw e }
    const lastM = kd(nowT).getUTCMonth()
    for (let m = 0; m <= lastM; m++) {
      const a = monthStart(m), b = (m === 11 ? Y1 : monthStart(m + 1)) - 1
      state.units.push({ a, b: Math.min(b, nowT), page: 1, total: null, got: 0, done: false })
    }
    const iso = (t) => { const d = kd(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}+09:00` }
    let firstDraw = true, lastDraw = 0
    for (;;) {
      if (my.cancelled) break
      const unit = state.units.filter(u => !u.done).sort((x, y) => (x.total == null ? 0 : 1) - (y.total == null ? 0 : 1) || x.page - y.page || x.a - y.a)[0]
      if (!unit) break
      const q = `author:${state.login} author-date:${iso(unit.a)}..${iso(unit.b)}`
      let j
      try { j = await gh(`/search/commits?q=${encodeURIComponent(q)}&sort=author-date&order=asc&per_page=100&page=${unit.page}`, my) }
      catch (e) {
        if (e.rate) { await sleepCount(e.wait, my, `${nf(state.items.length)}개를 받았습니다.`); continue }
        if (e.notFound && state.items.length === 0 && state.units.every(u => u.total == null)) { setStatus(`@${login}의 커밋을 검색할 수 없습니다. 아이디를 확인하세요.`, 'err'); return }
        if (e.cancel) throw e
        unit.done = true; continue
      }
      if (unit.total == null && j.total_count > 1000 && unit.b - unit.a > DAY * 2) {
        const mid = Math.floor((unit.a + unit.b) / 2)
        state.units.splice(state.units.indexOf(unit), 1, { a: unit.a, b: mid, page: 1, total: null, got: 0, done: false }, { a: mid + 1, b: unit.b, page: 1, total: null, got: 0, done: false })
      } else {
        unit.total = j.total_count
        for (const it of j.items || []) {
          if (state.seen.has(it.sha)) continue
          state.seen.add(it.sha)
          const t = Date.parse(it.commit?.author?.date) / 1000
          if (!(t >= Y0 && t < Y1)) continue
          state.items.push({ sha: it.sha.slice(0, 7), t, msg: (it.commit?.message || '').split('\n')[0].slice(0, 160), full: it.repository?.full_name || '?', desc: it.repository?.description || '' })
        }
        unit.got += (j.items || []).length; unit.page++
        if ((j.items || []).length < 100 || unit.got >= Math.min(unit.total, 1000)) unit.done = true
      }
      const allKnown = state.units.every(u => u.total != null)
      const known = state.units.filter(u => u.total != null).reduce((s, u) => s + Math.min(u.total, 1000), 0)
      meterBar.style.width = `${Math.min(100, (allKnown ? state.items.length / Math.max(1, known) : 0.1) * 100).toFixed(1)}%`
      setStatus(`@${state.login} 공개 커밋 ${nf(state.items.length)}개를 받았습니다${allKnown ? ` (전체 ${nf(state.units.reduce((s, u) => s + u.total, 0))}개)` : ''}.`)
      const now = performance.now()
      if (state.items.length && (firstDraw || now - lastDraw > 1500)) {
        if (firstDraw) setHash(state.login)
        firstDraw = false; lastDraw = now
        loadDataset(liveDataset(state))
      }
    }
    if (!my.cancelled) { try { const pr = await gh(`/search/issues?q=${encodeURIComponent(`author:${state.login} type:pr created:2026-01-01..2026-12-31`)}&per_page=1`, my); state.prs = pr.total_count } catch (e) { if (e.cancel) throw e } }
    state.done = !my.cancelled
    loadDataset(liveDataset(state))
    if (!state.items.length) setStatus(`@${state.login}의 2026년 공개 커밋이 없습니다.`, 'err')
    else {
      setStatus(my.cancelled ? `@${state.login} 공개 커밋 ${nf(state.items.length)}개까지 받고 멈췄습니다.` : `@${state.login} 공개 커밋 ${nf(state.items.length)}개를 모두 받았습니다.`)
      if (state.done) writeCache(state.login, { ...state, seen: undefined })
    }
    setHash(state.login)
  } catch (e) {
    if (!e.cancel) setStatus(canFetch === false ? TXT.blocked : '연결이 끊겨 조회를 마치지 못했습니다. 잠시 뒤 다시 시도하세요.', 'err')
  } finally {
    if (job === my) { goBtn.disabled = false; stopBtn.hidden = true; meter.hidden = true }
  }
}
form.addEventListener('submit', (e) => { e.preventDefault(); lookup(uid.value) })
stopBtn.onclick = () => { if (job) { job.cancelled = true; stopBtn.hidden = true } }
backBtn.onclick = () => { job?.cancel?.(); showSnapshot(); setHash('') }
function setHash(login) { try { history.replaceState(null, '', login ? '#' + login : location.pathname + location.search) } catch {} }
function showSnapshot() { goBtn.disabled = false; stopBtn.hidden = true; meter.hidden = true; backBtn.hidden = true; loadDataset(fromSnapshot(SNAP)); setStatus('') }

// ── 시작 ──
helpEl.textContent = TXT.live
document.getElementById('lead').textContent = TXT.lead
document.getElementById('guide').textContent = TXT.guide
new ResizeObserver(resize).observe(stage)
addEventListener('resize', drawStrip)
markView()
resize()
showSnapshot()
requestAnimationFrame(frame)
probe().then(() => {
  if (!canFetch) { helpEl.textContent = TXT.blocked; form.querySelector('.row').hidden = true; return }
  const h = decodeURIComponent((location.hash || '').slice(1))
  if (h && h.toLowerCase() !== 'greatsong' && /^[a-z\d-]{1,39}$/i.test(h)) { uid.value = h; lookup(h) }
})
window.__galaxy = { frame: (t) => frame(t ?? performance.now()), st, get D() { return D } }
</script>
